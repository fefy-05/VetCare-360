<!-- Fragmento #1 que irá en el head de todas las páginas-->
<head th:fragment="head">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VetCare 360</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- Fragmento #2  define el encabezado de las páginas -->
<nav th:fragment="header" class="navbar navbar-dark bg-success mb-5 position-fixed top-0 end-0" style="left: 260px;">
    <div class="container">
        <a class="navbar-brand" href="/inicio">🐾 VetCare 360</a>
    </div>
</nav>

<!-- Fragmento #3 define el aside de las paginas -->
<aside th:fragment="aside" class="position-fixed top-0 bottom-0 start-0 d-flex flex-column bg-white border-end p-3" style="width: 260px;">
    <a class="d-flex align-items-center gap-2 mb-4 text-decoration-none text-success-emphasis" href="/inicio">
        <!--<img src="RUTA_DE_TU_IMAGEN" alt="Logo VetCare 360" width="40" height="40" class="rounded-3">-->
        <div class="lh-1">
            <strong class="d-block fs-5">VetCare 360</strong>
            <small class="text-uppercase text-secondary" style="font-size: .6rem;">Atención veterinaria</small>
        </div>
    </a>

    <small class="text-uppercase text-secondary mb-2" style="font-size: .65rem;">Cuidado de tus mascotas</small>

    <nav class="nav flex-column gap-1">
        <a class="nav-link active bg-success-subtle text-success-emphasis fw-semibold rounded" href="/inicio">Inicio</a>
        <a class="nav-link text-body rounded" href="/mascotas">Mis mascotas</a>
        <a class="nav-link text-body rounded" href="/citas">Citas</a>
        <a class="nav-link text-body rounded" href="/servicios">Servicios</a>
        <a sec:authorize="hasRole('ADMIN')" class="nav-link text-body rounded" href="/usuarios">Usuarios registrados</a>
        <a class="nav-link text-body rounded" href="/cuenta">Mi cuenta</a>
    </nav>

    <form th:action="@{/logout}" method="post" class="mt-auto border-top pt-3">
        <button type="submit" class="nav-link text-body rounded w-100 text-start bg-transparent border-0">Cerrar sesión</button>
    </form>
</aside>


<!-- Fragmento #4 encabezado sin aside -->
<nav th:fragment="headerPublico" class="navbar navbar-dark bg-success mb-5">
    <div class="container">
        <a class="navbar-brand" href="/inicio">🐾 VetCare 360</a>
    </div>
</nav>
