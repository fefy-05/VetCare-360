<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cita | VetCare 360</title>
    </head>
    <body>

        <div th:replace="~{general/fragmentos :: encabezado}"></div>

        <div class="container-fluid">
            <div class="row">

                <div th:replace="~{general/fragmentos :: sidebar}"></div>

                <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4"
                      style="margin-top: 80px;">

                    <div class="mb-4">
                        <h2 class="fw-bold" th:text="${titulo}">Registrar cita</h2>
                        <p class="text-muted mb-0">
                            Complete la información correspondiente a la cita veterinaria.
                        </p>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-body p-4">

                            <form th:action="${accion}"
                                  th:object="${citaForm}"
                                  method="post">

                                <div class="row g-3">

                                    <!-- Mascota -->
                                    <div class="col-md-12">
                                        <label for="mascotaId" class="form-label">
                                            Mascota
                                        </label>

                                        <select id="mascotaId"
                                                th:field="*{mascotaId}"
                                                class="form-select"
                                                th:classappend="${#fields.hasErrors('mascotaId')} ? 'is-invalid' : ''">

                                            <option value="">Seleccione una mascota</option>

                                            <option th:each="mascota : ${mascotas}"
                                                    th:value="${mascota.id}"
                                                    th:text="${mascota.nombre + ' - ' + mascota.propietario.nombre + ' ' + mascota.propietario.apellidos}">
                                            </option>

                                        </select>

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('mascotaId')}"
                                             th:errors="*{mascotaId}">
                                        </div>
                                    </div>

                                    <!-- Fecha -->
                                    <div class="col-md-6">
                                        <label for="fecha" class="form-label">
                                            Fecha de la cita
                                        </label>

                                        <input type="date"
                                               id="fecha"
                                               th:field="*{fecha}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid' : ''">

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('fecha')}"
                                             th:errors="*{fecha}">
                                        </div>
                                    </div>

                                    <!-- Hora -->
                                    <div class="col-md-6">
                                        <label for="hora" class="form-label">
                                            Hora de la cita
                                        </label>

                                        <input type="time"
                                               id="hora"
                                               th:field="*{hora}"
                                               class="form-control"
                                               th:classappend="${#fields.hasErrors('hora')} ? 'is-invalid' : ''">

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('hora')}"
                                             th:errors="*{hora}">
                                        </div>
                                    </div>

                                    <!-- Motivo -->
                                    <div class="col-md-12">
                                        <label for="motivo" class="form-label">
                                            Motivo de la cita
                                        </label>

                                        <textarea id="motivo"
                                                  th:field="*{motivo}"
                                                  class="form-control"
                                                  rows="3"
                                                  maxlength="255"
                                                  placeholder="Describa el motivo de la consulta"
                                                  th:classappend="${#fields.hasErrors('motivo')} ? 'is-invalid' : ''">
                                        </textarea>

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('motivo')}"
                                             th:errors="*{motivo}">
                                        </div>
                                    </div>

                                    <!-- Estado -->
                                    <div class="col-md-6">
                                        <label for="estado" class="form-label">
                                            Estado de la cita
                                        </label>

                                        <select id="estado"
                                                th:field="*{estado}"
                                                class="form-select"
                                                th:classappend="${#fields.hasErrors('estado')} ? 'is-invalid' : ''">

                                            <option value="">Seleccione un estado</option>
                                            <option value="Programada">Programada</option>
                                            <option value="Realizada">Realizada</option>
                                            <option value="Cancelada">Cancelada</option>

                                        </select>

                                        <div class="invalid-feedback"
                                             th:if="${#fields.hasErrors('estado')}"
                                             th:errors="*{estado}">
                                        </div>
                                    </div>

                                </div>

                                <hr class="my-4">

                                <div class="d-flex justify-content-end gap-2">

                                    <a th:href="@{/citas}"
                                       class="btn btn-outline-secondary">
                                        Cancelar
                                    </a>

                                    <button type="submit" class="btn btn-primary">
                                        <i class="bi bi-save"></i>
                                        Guardar
                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>

                </main>
            </div>
        </div>

    </body>
</html>
