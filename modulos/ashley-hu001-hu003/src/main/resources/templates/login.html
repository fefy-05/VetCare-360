<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VetCare 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success mb-5"><div class="container"><a class="navbar-brand" href="/inicio">🐾 VetCare 360</a></div></nav><main class="container" style="max-width:680px"><div class="card shadow-sm"><div class="card-body p-4"><h2>Iniciar sesión</h2><div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos.</div><div th:if="${param.logout}" class="alert alert-info">Sesión cerrada.</div><div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div><form th:action="@{/login}" method="post"><label class="mt-3">Correo electrónico</label><input name="username" type="email" class="form-control" required><label class="mt-3">Contraseña</label><input name="password" type="password" class="form-control" required><button class="btn btn-success mt-4">Ingresar</button> <a href="/registro" class="btn btn-link mt-4">Crear cuenta</a></form></div></div></main></body></html>
