<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VetCare 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success mb-5"><div class="container"><a class="navbar-brand" href="/inicio">🐾 VetCare 360</a></div></nav><main class="container" style="max-width:680px"><div class="card shadow-sm"><div class="card-body p-4"><h2>Crear cuenta</h2><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="@{/registro}" th:object="${registroForm}"><label class="mt-3">Nombre</label><input class="form-control" th:field="*{nombre}" required><div class="text-danger" th:errors="*{nombre}"></div><label class="mt-3">Correo electrónico</label><input class="form-control" type="email" th:field="*{correo}" required><div class="text-danger" th:errors="*{correo}"></div><label class="mt-3">Contraseña (mínimo 8 caracteres)</label><input class="form-control" type="password" th:field="*{password}" required minlength="8"><div class="text-danger" th:errors="*{password}"></div><button class="btn btn-success mt-4">Registrarme</button> <a href="/login" class="btn btn-link mt-4">Ya tengo cuenta</a></form></div></div></main></body></html>
