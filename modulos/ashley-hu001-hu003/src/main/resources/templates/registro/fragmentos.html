<!-- Fragmento: formulario de registro -->
<main th:fragment="registro" class="container" style="max-width:680px">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2>Crear cuenta</h2>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form method="post" th:action="@{/registro}" th:object="${registroForm}">
                <label class="mt-3">Nombre</label>
                <input class="form-control" th:field="*{nombre}" required>
                <div class="text-danger" th:errors="*{nombre}"></div>
                <label class="mt-3">Correo electrónico</label>
                <input class="form-control" type="email" th:field="*{correo}" required>
                <div class="text-danger" th:errors="*{correo}"></div>
                <label class="mt-3">Contraseña (mínimo 8 caracteres)</label>
                <input class="form-control" type="password" th:field="*{password}" required minlength="8">
                <div class="text-danger" th:errors="*{password}"></div>
                <button class="btn btn-success mt-4">Registrarme</button>
                <a href="/login" class="btn btn-link mt-4">Ya tengo cuenta</a>
            </form>
        </div>
    </div>
</main>
