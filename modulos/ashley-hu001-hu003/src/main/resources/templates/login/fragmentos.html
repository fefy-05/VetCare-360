<!-- Fragmento: formulario de inicio de sesión -->
<main th:fragment="login" class="container" style="max-width:680px">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h2>Iniciar sesión</h2>
            <div th:if="${param.error}" class="alert alert-danger">Correo o contraseña incorrectos.</div>
            <div th:if="${param.logout}" class="alert alert-info">Sesión cerrada.</div>
            <div th:if="${ok}" class="alert alert-success" th:text="${ok}"></div>
            <form th:action="@{/login}" method="post">
                <label class="mt-3">Correo electrónico</label>
                <input name="username" type="email" class="form-control" required>
                <label class="mt-3">Contraseña</label>
                <input name="password" type="password" class="form-control" required>
                <button class="btn btn-success mt-4">Ingresar</button>
                <a href="/registro" class="btn btn-link mt-4">Crear cuenta</a>
            </form>
        </div>
    </div>
</main>
