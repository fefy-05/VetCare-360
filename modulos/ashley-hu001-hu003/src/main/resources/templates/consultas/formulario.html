
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta médica | VetCare 360</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm">
        <div class="card-header">
            <h3 class="mb-0">Registrar consulta médica</h3>
        </div>

        <div class="card-body">
            <form th:action="@{/consultas/guardar}"
                  th:object="${consulta}"
                  method="post">

                <div class="mb-3">
                    <label for="citaId" class="form-label">Cita</label>

                    <select id="citaId" name="citaId" class="form-select" required>
                        <option value="">Seleccione una cita</option>

                        <option th:each="cita : ${citas}"
                                th:value="${cita.id}"
                                th:text="${cita.fecha + ' - ' + cita.hora + ' - ' + cita.mascota.nombre}">
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="diagnostico" class="form-label">Diagnóstico</label>

                    <textarea id="diagnostico"
                              th:field="*{diagnostico}"
                              class="form-control"
                              rows="4"
                              maxlength="1000"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label for="observaciones" class="form-label">Observaciones</label>

                    <textarea id="observaciones"
                              th:field="*{observaciones}"
                              class="form-control"
                              rows="3"
                              maxlength="2000"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        Guardar consulta
                    </button>

                    <a th:href="@{/consultas}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
