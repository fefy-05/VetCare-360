
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas médicas | VetCare 360</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Consultas médicas</h2>

        <a th:href="@{/consultas/nueva}" class="btn btn-primary">
            Nueva consulta
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha de registro</th>
                        <th>Cita</th>
                        <th>Mascota</th>
                        <th>Diagnóstico</th>
                        <th>Observaciones</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="consulta : ${consultas}">
                        <td th:text="${consulta.id}"></td>

                        <td th:text="${#temporals.format(consulta.fechaRegistro, 'dd/MM/yyyy HH:mm')}"></td>

                        <td th:text="${consulta.cita.fecha + ' ' + consulta.cita.hora}"></td>

                        <td th:text="${consulta.cita.mascota.nombre}"></td>

                        <td th:text="${consulta.diagnostico}"></td>

                        <td th:text="${consulta.observaciones}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(consultas)}">
                        <td colspan="6" class="text-center text-muted">
                            No hay consultas médicas registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

</div>

</body>
</html>
