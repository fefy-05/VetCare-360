<!doctype html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VetCare 360</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><nav class="navbar navbar-dark bg-success mb-5"><div class="container"><a class="navbar-brand" href="/inicio">🐾 VetCare 360</a></div></nav><main class="container" style="max-width:680px"><div class="card shadow-sm"><div class="card-body p-4"><h2>Cambiar contraseña</h2><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form method="post" th:action="@{/cambiar-clave}" th:object="${cambioClaveForm}"><label class="mt-3">Contraseña actual</label><input type="password" class="form-control" th:field="*{actual}" required><label class="mt-3">Nueva contraseña</label><input type="password" class="form-control" th:field="*{nueva}" required minlength="8"><div class="text-danger" th:errors="*{nueva}"></div><label class="mt-3">Confirmar contraseña</label><input type="password" class="form-control" th:field="*{confirmar}" required><button class="btn btn-success mt-4">Guardar nueva contraseña</button> <a href="/inicio" class="btn btn-secondary mt-4">Cancelar</a></form></div></div></main></body></html>
